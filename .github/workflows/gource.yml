name: Gource visualization

on:
  push:
    branches: [main]
    paths-ignore:
      - "gource.mp4"
  pull_request:
    branches: [main]
    paths-ignore:
      - "gource.mp4"
  workflow_dispatch:

jobs:
  gource:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gource
        uses: nbprojekt/gource-action@57256d303c5a9a5e72ed92ba13e3e83c5ec8b257
        with:
          gource_resolution: 1080p
          gource_fps: 60
          gource_filename_time: 3
          gource_hide_items: 'mouse,date,filenames'
          gource_auto_skip_seconds: 0.1
          gource_title: "${{ github.event.repository.name }} | Development History"
          gource_seconds_per_day: 0.4

      - name: Install ffmpeg (runner)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Re-encode 1080p
        run: |
          ffmpeg -y -i ./gource/gource.mp4 \
            -c:v libx264 -crf 18 -level 4.1 -preset medium -tune film \
            -filter:v "scale=-1:1080" -sws_flags lanczos \
            -c:a aac -b:a 192k -ar 48000 \
            -movflags +faststart \
            ./gource.mp4

      - name: Downscale to 720p for README embed
        run: |
          ffmpeg -y -i ./gource.mp4 \
            -c:v libx264 -crf 20 -preset medium \
            -vf "scale=-1:720" -c:a aac -b:a 192k \
            gource-720p.mp4

      - name: Upload video
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-gource
          path: ./gource.mp4
          retention-days: 30

      - name: Commit gource videos
        if: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gource.mp4 gource-720p.mp4 || true
          git diff --staged --quiet || git commit -m "ci: update gource visualization (automated)"
          git push
